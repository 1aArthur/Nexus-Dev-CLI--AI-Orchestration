name: nexus

packages:
  - apps/*

command:
  bootstrap:
    environment:
      sdk: ">=3.8.0 <4.0.0"
  version:
    branch: feat/fullstack-d2

scripts:
  analyze:
    run: flutter analyze
    exec:
      concurrency: 1
    packageFilters:
      flutter: true
  test:
    run: flutter test
    exec:
      concurrency: 1
    packageFilters:
      flutter: true
