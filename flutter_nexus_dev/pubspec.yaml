name: nexus_dev_orchestrator
description: Nexus Dev Orchestrator - Full-Stack DevSecOps CLI with Multi-Agent Orchestration, Terminal, Security Auditing, and Voice Integration
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Navigation
  go_router: ^13.2.1
  
  # Networking
  dio: ^5.4.3
  web_socket_channel: ^2.4.5
  
  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Audio / TTS
  flutter_tts: ^4.0.2
  audio_waveforms: ^1.0.4
  
  # Permissions
  permission_handler: ^11.3.0
  
  # UI / Animations
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  lottie: ^3.1.0
  
  # Utilities
  intl: ^0.19.0
  collection: ^1.18.0
  path: ^1.9.0
  uuid: ^4.4.0
  crypto: ^3.0.3
  logger: ^2.2.0
  
  # Platform channels
  flutter_secure_storage: ^9.2.2
  
  # Code generation
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  
  # Code generation
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
  
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
